name: "🎙️ 語音合成請求"
description: "用你的聲音朗讀一段文字（IndexTTS-2 zero-shot 聲音克隆，跑在 Colab T4 GPU）"
title: "[synthesize] "
labels: ["synthesize"]
body:
  - type: markdown
    attributes:
      value: |
        送出後 GitHub Action 會自動觸發合成，跑在免費 Colab T4 GPU 上。
        環境建置＋模型下載約 15 分鐘，之後文字會依長度自動切塊處理，每塊再加幾分鐘（越長的文字等越久，但不會有硬性卡死）。完成後會在這個 issue 底下留言 Release 連結。
        **同時只能有一個合成在跑**（Colab 免費帳號限制），排隊中的 issue 會等前一個跑完才開始。
  - type: textarea
    id: text
    attributes:
      label: 要朗讀的文字
      description: 每一行是獨立一段，會分開合成再依序拼接。建議每行 15-30 字最自然，單行最多 200 字。全部加起來最多 6000 字（約 200 行），超過會直接失敗；字數越多跑越久（大約每 700 字多等幾分鐘，6000 字整篇約 2.5 小時）。
      placeholder: |
        君不見，黃河之水天上來，奔流到海不復回。
        君不見，高堂明鏡悲白髮，朝如青絲暮成雪。
    validations:
      required: true
  - type: dropdown
    id: emotion
    attributes:
      label: 情緒
      description: 套用到全部段落的基礎情緒。
      options:
        - "自然 (neutral)"
        - "高興 (happy)"
        - "憤怒 (angry)"
        - "悲傷 (sad)"
        - "低落 (melancholic)"
        - "驚訝 (surprised)"
      default: 0
    validations:
      required: true
  - type: input
    id: weight
    attributes:
      label: "情緒強度 (0.1 - 1.0)"
      description: 留空預設 0.85。數字越大情緒越明顯，但過高可能讓音色失真。
      placeholder: "0.85"
    validations:
      required: false
  - type: dropdown
    id: model_version
    attributes:
      label: 模型版本
      description: 2.5 比較快、支援語速控制，但中文語音會偏向大陸腔（強制的語言 token 沒有台灣腔選項）；2.0 沒有這個 token，比較貼近參考音檔本身的腔調。不確定就選 2.0。
      options:
        - "2.0（貼近參考音檔原始腔調，推薦）"
        - "2.5（較快，但中文偏大陸腔）"
      default: 0
    validations:
      required: true
