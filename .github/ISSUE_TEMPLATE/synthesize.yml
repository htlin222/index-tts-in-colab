name: "🎙️ 語音合成請求"
description: "用你的聲音朗讀一段文字（IndexTTS-2 zero-shot 聲音克隆，跑在 Colab T4 GPU）"
title: "[synthesize] "
labels: ["synthesize"]
body:
  - type: markdown
    attributes:
      value: |
        送出後 GitHub Action 會自動觸發合成，跑在免費 Colab T4 GPU 上。
        單次 run 約 15-25 分鐘（含環境建置與模型下載），完成後會在這個 issue 底下留言 Release 連結。
        **同時只能有一個合成在跑**（Colab 免費帳號限制），排隊中的 issue 會等前一個跑完才開始。
  - type: textarea
    id: text
    attributes:
      label: 要朗讀的文字
      description: 每一行是獨立一段，會分開合成再依序拼接。建議每行 15-30 字最自然，避免單行過長。
      placeholder: |
        君不見，黃河之水天上來，奔流到海不復回。
        君不見，高堂明鏡悲白髮，朝如青絲暮成雪。
    validations:
      required: true
  - type: dropdown
    id: emotion
    attributes:
      label: 情緒
      description: 套用到全部段落的基礎情緒。
      options:
        - "自然 (neutral)"
        - "高興 (happy)"
        - "憤怒 (angry)"
        - "悲傷 (sad)"
        - "低落 (melancholic)"
        - "驚訝 (surprised)"
      default: 0
    validations:
      required: true
  - type: input
    id: weight
    attributes:
      label: "情緒強度 (0.1 - 1.0)"
      description: 留空預設 0.85。數字越大情緒越明顯，但過高可能讓音色失真。
      placeholder: "0.85"
    validations:
      required: false
